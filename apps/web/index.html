<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b0a">
  <meta name="description" content="PartyQueue — vraag jouw favoriete muziek aan.">
  <title>PartyQueue — New Year's Eve 2026</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="PartyQueue home"><span class="brand-mark">P</span><span>PARTY<span class="accent">QUEUE</span></span></a>
      <span class="event-pill"><span class="live-dot"></span> NEW YEAR'S EVE 2026</span>
    </header>
    <section class="hero">
      <p class="eyebrow">YOUR PARTY. YOUR MUSIC.</p>
      <h1>What do you<br><span class="accent">want to hear?</span></h1>
      <p class="intro">Drop a track into the party queue. The DJ takes it from here.</p>
    </section>
    <section class="join-card" aria-labelledby="join-title">
      <div class="section-heading"><span class="step">01</span><div><h2 id="join-title">Join the queue</h2><p>Choose a nickname to get started.</p></div></div>
      <form id="join-form">
        <label for="nickname">Your nickname</label>
        <input id="nickname" name="nickname" maxlength="24" minlength="2" placeholder="e.g. Disco Koen" autocomplete="nickname" required>
        <label for="event-code">Party code</label>
        <input id="event-code" name="eventCode" maxlength="32" placeholder="Enter the code from the QR poster" required>
        <button class="button button-primary" type="submit">LET ME IN <span aria-hidden="true">↗</span></button>
      </form>
      <p class="fine-print">No Spotify account. No app download. Just good music.</p>
      <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
    </section>
    <footer><span class="site-credit">POWERED BY <strong class="datuur-mark">#DATUUR</strong></span><span>31.12.2026 <span class="accent">→</span> 01.01.2027</span></footer>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
