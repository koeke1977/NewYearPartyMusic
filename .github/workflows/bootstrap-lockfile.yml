name: Bootstrap reproducible npm lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: partyqueue-lockfile-bootstrap
  cancel-in-progress: false

jobs:
  create-lockfile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile from the declared package manifest
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify a clean reproducible install
        run: |
          rm -rf node_modules
          npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Verify the locked dependency tree
        run: |
          npm run typecheck
          npm run test:architecture
          npm test

      - name: Commit lockfile and remove this one-time bootstrap workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/bootstrap-lockfile.yml
          git commit -m "build: lock npm dependency tree"
          git push origin HEAD:main
