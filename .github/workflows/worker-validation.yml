name: Worker validation and production deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      approve_production_deploy:
        description: 'Type YES to approve the production deployment after reviewing the validated main revision.'
        required: true
        type: choice
        options:
          - NO
          - YES

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: partyqueue-main-release
  cancel-in-progress: false

jobs:
  validate:
    name: Typecheck and Worker bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: TypeScript validation
        run: npm run typecheck

      - name: Architecture dependency boundary check
        run: npm run test:architecture

      - name: Apply D1 migrations to a local database
        run: npm run db:migrate:local

      - name: Security characterization tests
        run: npm test

      - name: Local AI bridge contract tests
        run: npm run test:local-ai-bridge

      - name: Test Worker dry run
        run: npx wrangler deploy --dry-run

      - name: Production static release preflight
        run: npm run release:preflight

      - name: Production Worker dry run
        run: npx wrangler deploy --env production --dry-run

  ui-screenshot-baseline:
    name: Browser journeys and visual baselines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify guest and DJ browser journeys
        run: npm run test:browser

      - name: Capture UI baselines
        run: npm run screenshots:baseline

      - name: Upload screenshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: partyqueue-ui-baseline
          path: artifacts/ui-baseline/*.png
          if-no-files-found: error
          retention-days: 14

  auto-merge:
    name: Automatically merge validated pull requests
    runs-on: ubuntu-latest
    needs: [validate, ui-screenshot-baseline]
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    steps:
      - name: Enable squash auto-merge after all required checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --squash

  deploy-production:
    name: Deploy production Worker to Cloudflare
    runs-on: ubuntu-latest
    needs: [validate, ui-screenshot-baseline]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.approve_production_deploy == 'YES' &&
      needs.validate.result == 'success' &&
      needs.ui-screenshot-baseline.result == 'success'
    environment:
      name: production
    steps:
      - name: Checkout merged main revision
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Deploy approved main revision
        run: npm run deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PARTYQUEUE_ALLOW_PRODUCTION_DEPLOY: YES
