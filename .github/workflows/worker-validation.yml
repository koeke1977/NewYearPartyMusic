name: Worker validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck and Worker bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: TypeScript validation
        run: npm run typecheck

      - name: Security characterization tests
        run: npm test

      - name: Cloudflare Worker dry run
        run: npx wrangler deploy --dry-run


  ui-screenshot-baseline:
    name: Capture guest and DJ desktop/mobile screenshots
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture UI baselines
        run: npm run screenshots:baseline

      - name: Upload screenshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: partyqueue-ui-baseline
          path: artifacts/ui-baseline/*.png
          if-no-files-found: error
          retention-days: 14
